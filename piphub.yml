# PipHub Configuration - Contains all setup() function arguments for setup.py
# This file is used to automatically generate setup.py and manage releases

# Required setup() arguments
name: "piphub"
version: "1.1.0"
author: "Luis Tanedo"
author_email: "lloydtan@buffalo.edu"
description: "Python package release automation tool for GitHub"
url: "https://github.com/ltanedo/piphub"

# Optional setup() arguments
license: "MIT"
long_description_content_type: "text/markdown"
python_requires: ">=3.7"

# Entry points to expose a CLI on install
entry_points:
  console_scripts:
    - "piphub=piphub.__main__:main"

# Package discovery
# packages will be auto-discovered with find_packages()

# Dependencies (use YAML list format)
install_requires: []

# Keywords for PyPI
keywords: ["github", "release", "automation", "python", "packaging", "ci-cd", "deployment"]

# Classifiers for PyPI
classifiers: [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution"
]

# Project URLs
project_urls: {
    "Bug Reports": "https://github.com/ltanedo/piphub/issues",
    "Source": "https://github.com/ltanedo/piphub",
    "Documentation": "https://github.com/ltanedo/piphub#readme"
}

# Release-specific settings (not part of setup())
tag_prefix: "v"
target_branch: "master"
release_notes_file: "README.md"
draft: false
prerelease: false
auto_commit_requirements: true
